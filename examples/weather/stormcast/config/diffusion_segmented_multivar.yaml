defaults:
  - dataset/segmented_multivar
  - model/stormcast
  - training/default
  - sampler/edm_deterministic
  - hydra/default
  - _self_

model:
  use_regression_net: True
  regression_weights: "CHANGE_ME/regression/StormCastUNet.0.0.mdlus"
  hyperparameters:
    additive_pos_embed: True

training:
  run_id: segmented-diffusion
  loss:
    type: 'edm'
